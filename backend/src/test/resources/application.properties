# Nos testes usamos um banco H2 em memória (não precisa do PostgreSQL)
spring.datasource.url=jdbc:h2:mem:agenda_teste;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

api.security.token.secret=segredo-de-teste
api.security.token.horas-validade=1
api.cors.origem=http://localhost:4200

app.senha-admin=admin123
app.senha-comum=comum123
app.dados-exemplo=false
