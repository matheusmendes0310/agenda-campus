spring.application.name=agenda-campus
server.port=8080

# Banco de dados PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agenda_campus}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate cria e atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Token JWT
api.security.token.secret=${JWT_SECRET:}
api.security.token.horas-validade=2

# Endereço do front-end Angular liberado no CORS
api.cors.origem=${CORS_ORIGEM:http://localhost:4200}

# Usuários criados na primeira execução
app.senha-admin=${SENHA_ADMIN:admin123}
app.senha-comum=${SENHA_COMUM:comum123}

# Cria eventos, participantes e inscrições de exemplo quando o banco está vazio
app.dados-exemplo=${DADOS_EXEMPLO:true}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
